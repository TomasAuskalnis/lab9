name: lab9-basic-tests

on:
  push:
    branches: [ "main", "master", "test" ]
  pull_request:
    branches: [ "main", "master", "test" ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code onto the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Grant execution permissions to your script
      - name: Make Script Executable
        run: chmod +x ./validate-data.sh

      # 3. Execute the test and complete the job
      - name: Run Script and verify output
        run: |
          echo "Starting validation test..."
          
          # Simulate input (Name: "John" [4 chars], Mobile: "1234567890" [10 chars])
          output=$(printf "John\n1234567890\n" | ./validate-data.sh)
          echo "Script Output: $output"

          # Verify output and complete job
          if [ "$output" = "PASS" ]; then
            echo "✅ Job passed successfully!"
            exit 0
          else
            echo "❌ Job failed: Expected PASS, got $output"
            exit 1
          fi
